services:
  # 1.1. Traefik (API Gateway/Reverse Proxy)
  traefik:
    image: traefik:v2.10
    container_name: traefik_proxy
    command:
      # Kích hoạt Docker Provider
      - --providers.docker=true
      # Træfik chỉ đọc các containers được cấu hình rõ ràng bằng labels
      - --providers.docker.exposedbydefault=false
      # Cấu hình cổng HTTP (Entrypoint)
      - --entrypoints.web.address=:80
      # Kích hoạt Dashboard (không bắt buộc, truy cập qua http://localhost:8080)
      - --api.insecure=true
    ports:
      - "80:80"     # Cổng truy cập bên ngoài (tất cả lưu lượng vào)
      - "8080:8080" # Cổng Træfik Dashboard
    volumes:
      # Cho phép Træfik giao tiếp với Docker để đọc metadata (labels)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    
  # 1.2. REDIS (Cache/Session)
  redis:
    image: redis:7-alpine
    container_name: redis_cache_server
    # ports: - "6379:6379" # Không cần expose ra ngoài
    volumes:
      - redis_data:/data
    restart: always

  # 1.3. RABBITMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "15672:15672" # Management UI (http://localhost:15672)
      # ports: - "5672:5672" # Cổng này tự động mở trong mạng Compose
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    restart: always
  # 1.4. REDIS INSIGHT (Giao diện quản lý Redis)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis_insight_ui
    # Ánh xạ cổng 8001 của container ra cổng 8001 của máy host
    ports:
      - "8001:8001"
    # Mount Volume để RedisInsight lưu trữ cấu hình
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis
    restart: always
  # ------------------------------------------------------------------
  # 2. MICROSERVICES
  # ------------------------------------------------------------------

  # 2.1. API GATEWAY (Điểm vào duy nhất)
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api_gateway_container
    # Lưu ý: Không cần ports: - "3000:3000" vì Træfik đã xử lý
    env_file:
      - ./api_gateway/.env
    environment:
      REDIS_URL: 'redis://redis:6379'
      # Các URL nội bộ cần phải trỏ đến tên service trong mạng Compose:
      URL_TRIP_SERVICE: http://trip_schedule_service:3001
      URL_AUTH_SERVICE: http://auth_service:3002
      URL_NOTIFICATION_SERVICE: http://notification_service:3003
      URL_PROMOTION_SERVICE: http://promotion_service:3004
      URL_BOOKING_SERVICE: http://booking_service:3005
      URL_AI_SERVICE: http://ai_service:3006
    # Cấu hình Træfik để định tuyến lưu lượng từ bên ngoài đến cổng 3000 của Gateway
    labels:
      - "traefik.enable=true"
      # Định tuyến tất cả lưu lượng truy cập đến Gateway
      - "traefik.http.routers.api-gateway.rule=Host(`localhost`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
    depends_on:
      - redis
      - rabbitmq
      - auth_service
      - trip_schedule_service
      - notification_service
      - promotion_service
      - booking_service 
      - ai_service
    restart: always

  # 2.2. AUTH SERVICE
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service_container
    # ports: - "3002:3002" # Không cần expose
    env_file:
      - ./auth_service/.env
    environment:
      REDIS_URL: 'redis://redis:6379'
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
    # Quan trọng: Không thêm labels Træfik để ngăn chặn truy cập trực tiếp từ bên ngoài
    depends_on:
      - redis
      - rabbitmq
      # BỎ eureka_server
    restart: always
  
  # 2.3. BOOKING SERVICE
  booking_service:
    build:
      context: ./booking_service
      dockerfile: Dockerfile
    container_name: booking_service_container
    env_file:
      - ./booking_service/.env
    environment:
      REDIS_URL: 'redis://redis:6379'
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
    depends_on:
      - redis
      - rabbitmq
    restart: always

  # 2.4. NOTIFICATION SERVICE
  notification_service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    container_name: notification_service_container
    env_file:
      - ./notification_service/.env
    environment:
      REDIS_URL: 'redis://redis:6379'
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
    depends_on:
      - redis
      - rabbitmq
    restart: always

  # 2.5. PROMOTION SERVICE
  promotion_service:
    build:
      context: ./promotion_service
      dockerfile: Dockerfile
    container_name: promotion_service_container
    env_file:
      - ./promotion_service/.env
    environment:
      REDIS_URL: 'redis://redis:6379'
    depends_on:
      - redis
    restart: always

  # 2.6. TRIP SCHEDULE SERVICE
  trip_schedule_service:
    build:
      context: ./trip_schedule_service
      dockerfile: Dockerfile
    container_name: trip_schedule_service_container
    env_file:
      - ./trip_schedule_service/.env
    environment:
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
    depends_on:
      - rabbitmq
    restart: always

  # 2.7. AI SERVICE
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: ai_service_container
    env_file:
      - ./ai_service/.env
    environment:
      TRIP_API_URL: http://trip_schedule_service:3001/api/v1
      PROMO_API_URL: http://promotion_service:3004/api/v1
      BOOKING_API_URL: http://booking_service:3005/api/v1
      GIAVE_API_URL: http://trip_schedule_service:3001/api/v1/gia-ve/tim-gia-ve-ap-dung
      TUYEN_DUONG_API_URL: http://trip_schedule_service:3001/api/v1/tuyen-duong/lay-tuyen-duong
    depends_on:
      - auth_service 
      - trip_schedule_service
      - promotion_service
      - booking_service 
    restart: always

# Định nghĩa Volumes để lưu trữ dữ liệu
volumes:
  redis_data:
  rabbitmq_data:
  redisinsight_data: